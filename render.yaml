services:
  - type: web
    name: kitchenlist-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node --import ./instrument.mjs index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SHARE_EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
